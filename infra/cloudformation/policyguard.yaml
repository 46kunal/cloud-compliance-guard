AWSTemplateFormatVersion: '2010-09-09'
Description: >
  PolicyGuard on AWS: VPC with public and private subnets, ALB and Auto Scaling dashboard servers,
  EBS and EFS storage, DynamoDB, Cognito login, CloudFront HTTPS, and a scheduled serverless scanner.

Parameters:
  ArtifactBucket:
    Type: String
    Description: Bucket created by artifacts.yaml that holds the uploaded zips
  AppKey:
    Type: String
    Default: app.zip
  ScannerKey:
    Type: String
    Default: scanner.zip
  AdminEmail:
    Type: String
    Description: Receives the Cognito invitation (temporary password) for the first admin user
  AdminUsername:
    Type: String
    Default: pgadmin
  AlertEmail:
    Type: String
    Description: Receives HIGH-finding alerts and budget warnings (confirm the SNS subscription email)
  InstanceType:
    Type: String
    Default: t3.micro
  DesiredCapacity:
    Type: Number
    Default: 2
    MinValue: 2
    MaxValue: 4
  Profile:
    Type: String
    Default: india
    AllowedValues: [india, baseline]
  ScanIntervalMinutes:
    Type: Number
    Default: 15
    MinValue: 5
  AnchorLockMode:
    Type: String
    Default: GOVERNANCE
    AllowedValues: [GOVERNANCE, COMPLIANCE]
    Description: >
      Object Lock mode for audit-chain receipts. GOVERNANCE can be bypassed by an administrator with a special permission
      (the destroy script does this). COMPLIANCE cannot be shortened or deleted by anyone, including the account root user,
      until the retention date, so the stack cannot be fully deleted before then.
  AnchorRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Days each audit-chain receipt stays locked
  MonthlyBudgetUsd:
    Type: Number
    Default: 25
    Description: AWS Budgets warns the alert email at 80 percent of this amount

Mappings:
  Network:
    Cidr:
      Vpc: 10.0.0.0/16
      PublicA: 10.0.0.0/24
      PublicB: 10.0.1.0/24
      PrivateA: 10.0.10.0/24
      PrivateB: 10.0.11.0/24

Resources:
  # ------------------------------------------------------------------ Network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [Network, Cidr, Vpc]
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: policyguard-vpc}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: policyguard-igw}
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Network, Cidr, PublicA]
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: policyguard-public-a}
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Network, Cidr, PublicB]
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: policyguard-public-b}
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Network, Cidr, PrivateA]
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - {Key: Name, Value: policyguard-private-a}
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !FindInMap [Network, Cidr, PrivateB]
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - {Key: Name, Value: policyguard-private-b}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: policyguard-public-rt}
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable}
  PublicAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable}

  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - {Key: Name, Value: policyguard-nat}

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - {Key: Name, Value: policyguard-private-rt}
  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateAssocA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable}
  PrivateAssocB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable}

  # Gateway endpoints are free and keep DynamoDB and S3 traffic off the NAT gateway.
  DynamoDbEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # Flow logs kept for 365 days (meets PolicyGuard's own log-retention rules).
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/policyguard/${AWS::StackName}/vpc-flow'
      RetentionInDays: 365
  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: vpc-flow-logs.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-flow-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !GetAtt FlowLogGroup.Arn
  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn

  # ------------------------------------------------------------------ Security groups (ALB -> app -> EFS)
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public load balancer, HTTP only (CloudFront and the demo use port 80)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP from the internet}
      Tags:
        - {Key: Name, Value: policyguard-alb-sg}
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Dashboard servers, reachable only from the load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5000, ToPort: 5000, SourceSecurityGroupId: !Ref AlbSecurityGroup, Description: App port from ALB}
      Tags:
        - {Key: Name, Value: policyguard-app-sg}
  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EFS, reachable only from the dashboard servers
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 2049, ToPort: 2049, SourceSecurityGroupId: !Ref AppSecurityGroup, Description: NFS from app servers}
      Tags:
        - {Key: Name, Value: policyguard-efs-sg}

  # ------------------------------------------------------------------ Storage: EFS and DynamoDB
  FileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      BackupPolicy:
        Status: ENABLED
      FileSystemTags:
        - {Key: Name, Value: policyguard-evidence}
  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref PrivateSubnetA
      SecurityGroups: [!Ref EfsSecurityGroup]
  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref FileSystem
      SubnetId: !Ref PrivateSubnetB
      SecurityGroups: [!Ref EfsSecurityGroup]

  CountersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-counters'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: name, AttributeType: S}]
      KeySchema: [{AttributeName: name, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
  ScansTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-scans'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: scan_id, AttributeType: N}]
      KeySchema: [{AttributeName: scan_id, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
  FindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-findings'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: finding_key, AttributeType: S}
        - {AttributeName: id, AttributeType: N}
      KeySchema: [{AttributeName: finding_key, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - IndexName: id-index
          KeySchema: [{AttributeName: id, KeyType: HASH}]
          Projection: {ProjectionType: ALL}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
  FindingEventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-finding_events'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: finding_id, AttributeType: N}
        - {AttributeName: event_id, AttributeType: N}
      KeySchema:
        - {AttributeName: finding_id, KeyType: HASH}
        - {AttributeName: event_id, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
  FindingEvidenceTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-finding_evidence'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: finding_id, AttributeType: N}
        - {AttributeName: scan_id, AttributeType: N}
      KeySchema:
        - {AttributeName: finding_id, KeyType: HASH}
        - {AttributeName: scan_id, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
  ScanResourcesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-scan_resources'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: scan_id, AttributeType: N}
        - {AttributeName: resource_key, AttributeType: S}
      KeySchema:
        - {AttributeName: scan_id, KeyType: HASH}
        - {AttributeName: resource_key, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-audit_log'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: chain, AttributeType: S}
        - {AttributeName: seq, AttributeType: N}
      KeySchema:
        - {AttributeName: chain, KeyType: HASH}
        - {AttributeName: seq, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  DocumentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AWS::StackName}-documents'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: kind, AttributeType: S}
        - {AttributeName: id, AttributeType: S}
      KeySchema:
        - {AttributeName: kind, KeyType: HASH}
        - {AttributeName: id, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}

  # ------------------------------------------------------------------ Tamper-proof anchoring for the audit chain
  AnchorBucket:
    Type: AWS::S3::Bucket
    Properties:
      ObjectLockEnabled: true            # also turns on versioning
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: 'aws:kms'}
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - {Key: project, Value: policyguard}
        - {Key: purpose, Value: audit-anchors}
  AnchorBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AnchorBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt AnchorBucket.Arn, !Sub '${AnchorBucket.Arn}/*']
            Condition:
              Bool: {'aws:SecureTransport': 'false'}
  AnchorKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Signs PolicyGuard audit-chain receipts. The private key never leaves KMS.
      KeySpec: RSA_2048
      KeyUsage: SIGN_VERIFY
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal: {AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'}
            Action: 'kms:*'
            Resource: '*'
  AnchorKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-audit-anchor'
      TargetKeyId: !Ref AnchorKey

  # ------------------------------------------------------------------ Login (Cognito)
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - {Name: verified_email, Priority: 1}
  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 1
      TokenValidityUnits: {AccessToken: hours, IdToken: hours, RefreshToken: days}
  ViewerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: viewer, Description: Read-only}
  AuditorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: auditor, Description: 'Read plus evidence, audit trail and exports'}
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties: {UserPoolId: !Ref UserPool, GroupName: admin, Description: Everything including on-demand scans}
  AdminUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref AdminUsername
      DesiredDeliveryMediums: [EMAIL]
      UserAttributes:
        - {Name: email, Value: !Ref AdminEmail}
        - {Name: email_verified, Value: 'true'}
  AdminUserGroup:
    Type: AWS::Cognito::UserPoolUserToGroupAttachment
    Properties:
      UserPoolId: !Ref UserPool
      Username: !Ref AdminUser
      GroupName: !Ref AdminGroup

  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Signs dashboard session cookies; shared by every server so any of them accepts the cookie
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # ------------------------------------------------------------------ Alerts and budget
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${AWS::StackName}-alerts'
      KmsMasterKeyId: alias/aws/sns
  AlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: {Amount: !Ref MonthlyBudgetUsd, Unit: USD}
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - {SubscriptionType: EMAIL, Address: !Ref AlertEmail}

  # ------------------------------------------------------------------ Scanner (serverless)
  ScannerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-account-configuration
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetBucketLocation
                  - s3:GetBucketPolicy
                  - s3:GetBucketPolicyStatus
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetEncryptionConfiguration
                  - s3:GetBucketTagging
                  - s3:GetBucketVersioning
                  - iam:ListPolicies
                  - iam:GetPolicyVersion
                  - iam:ListUsers
                  - iam:GetLoginProfile
                  - iam:ListMFADevices
                  - ec2:DescribeSecurityGroups
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - logs:DescribeLogGroups
                  - guardduty:ListDetectors
                  - guardduty:GetDetector
                  - sts:GetCallerIdentity
                  - iam:GetAccountSummary
                  - iam:ListAccessKeys
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - ec2:DescribeFlowLogs
                  - ec2:DescribeVpcs
                  - s3:GetBucketLogging
                  - s3:GetLifecycleConfiguration
                  - rds:DescribeDBInstances
                  - dynamodb:ListTables
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeContinuousBackups
                  - dynamodb:ListTagsOfResource
                  - elasticfilesystem:DescribeFileSystems
                  - elasticfilesystem:DescribeBackupPolicy
                Resource: '*'
        - PolicyName: anchor-and-assume
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:PutObject, s3:PutObjectRetention, s3:GetObject, s3:GetObjectRetention]
                Resource: !Sub '${AnchorBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt AnchorBucket.Arn
              - Effect: Allow
                Action: [kms:Sign, kms:Verify, kms:DescribeKey]
                Resource: !GetAtt AnchorKey.Arn
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: 'arn:aws:iam::*:role/PolicyGuard*'
        - PolicyName: write-findings
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:DescribeTable
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref AlertTopic
  ScannerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-scanner'
      RetentionInDays: 365
  ScannerFunction:
    Type: AWS::Lambda::Function
    DependsOn: ScannerLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-scanner'
      Runtime: python3.12
      Handler: lambdas.scanner.handler.lambda_handler
      Role: !GetAtt ScannerRole.Arn
      MemorySize: 512
      Timeout: 300
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ScannerKey
      Environment:
        Variables:
          POLICYGUARD_BACKEND: dynamodb
          POLICYGUARD_PROFILE: !Ref Profile
          POLICYGUARD_TABLE_PREFIX: !Ref AWS::StackName
          POLICYGUARD_DRY_RUN: 'true'
          POLICYGUARD_ALERT_TOPIC_ARN: !Ref AlertTopic
          POLICYGUARD_HOME_ACCOUNT_ID: !Ref AWS::AccountId
          ANCHOR_BUCKET: !Ref AnchorBucket
          ANCHOR_KMS_KEY_ID: !Ref AnchorKey
          ANCHOR_LOCK_MODE: !Ref AnchorLockMode
          ANCHOR_RETENTION_DAYS: !Ref AnchorRetentionDays
  ScanSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Run the PolicyGuard scanner on a schedule
      ScheduleExpression: !Sub 'rate(${ScanIntervalMinutes} minutes)'
      State: ENABLED
      Targets:
        - Id: scanner
          Arn: !GetAtt ScannerFunction.Arn
  SchedulePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ScannerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ScanSchedule.Arn
  HighFindingsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-high-findings'
      AlarmDescription: One or more HIGH-severity findings are open
      Namespace: PolicyGuard
      MetricName: HighFindings
      Dimensions: [{Name: Service, Value: scanner}]
      Statistic: Maximum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  ScanFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-scan-failed'
      AlarmDescription: The scheduled scan failed
      Namespace: PolicyGuard
      MetricName: ScanFailed
      Dimensions: [{Name: Service, Value: scanner}]
      Statistic: Maximum
      Period: 900
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  # ------------------------------------------------------------------ Dashboard servers
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore   # Session Manager instead of SSH
      Policies:
        - PolicyName: admin-features
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:GetObjectRetention]
                Resource: !Sub '${AnchorBucket.Arn}/*'
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt AnchorBucket.Arn
              - Effect: Allow
                Action: [kms:Verify, kms:DescribeKey]
                Resource: !GetAtt AnchorKey.Arn
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminRemoveUserFromGroup
                  - cognito-idp:AdminListGroupsForUser
                Resource: !GetAtt UserPool.Arn
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: 'arn:aws:iam::*:role/PolicyGuard*'
        - PolicyName: dashboard
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:Query, dynamodb:Scan, dynamodb:PutItem, dynamodb:UpdateItem, dynamodb:DescribeTable]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AWS::StackName}-*'
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/${AppKey}'
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ScannerFunction.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SessionSecret
              - Effect: Allow
                Action: [autoscaling:DescribeAutoScalingGroups, autoscaling:DescribeScalingActivities]
                Resource: '*'
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    DependsOn: [MountTargetA, MountTargetB]
    Properties:
      LaunchTemplateData:
        ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Arn: !GetAtt InstanceProfile.Arn}
        SecurityGroupIds: [!Ref AppSecurityGroup]
        MetadataOptions:
          HttpTokens: required            # IMDSv2 only
          HttpPutResponseHopLimit: 1
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: {VolumeSize: 12, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true}
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - {Key: Name, Value: policyguard-dashboard}
              - {Key: project, Value: policyguard}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euxo pipefail
            dnf install -y python3.11 python3.11-pip amazon-efs-utils unzip
            mkdir -p /mnt/evidence /opt/policyguard
            echo "${FileSystem}:/ /mnt/evidence efs _netdev,tls 0 0" >> /etc/fstab
            for attempt in 1 2 3 4 5 6; do mount -a -t efs && break || sleep 10; done
            chmod 0775 /mnt/evidence
            aws s3 cp s3://${ArtifactBucket}/${AppKey} /tmp/app.zip --region ${AWS::Region}
            unzip -o /tmp/app.zip -d /opt/policyguard
            python3.11 -m venv /opt/policyguard/venv
            /opt/policyguard/venv/bin/pip install --quiet "Flask>=3.0" "boto3>=1.34" "gunicorn>=22"
            set +x
            SECRET=$(aws secretsmanager get-secret-value --secret-id ${SessionSecret} --query SecretString --output text --region ${AWS::Region})
            cat > /etc/policyguard.env <<ENV
            POLICYGUARD_BACKEND=dynamodb
            POLICYGUARD_TABLE_PREFIX=${AWS::StackName}
            POLICYGUARD_PROFILE=${Profile}
            POLICYGUARD_AUTH=cognito
            POLICYGUARD_COOKIE_SECURE=true
            POLICYGUARD_SECRET_KEY=$SECRET
            COGNITO_CLIENT_ID=${UserPoolClient}
            COGNITO_REGION=${AWS::Region}
            AWS_REGION=${AWS::Region}
            AWS_DEFAULT_REGION=${AWS::Region}
            POLICYGUARD_SCANNER_FUNCTION=${ScannerFunction}
            POLICYGUARD_ASG_NAME=${AWS::StackName}-asg
            POLICYGUARD_EVIDENCE_DIR=/mnt/evidence
            COGNITO_USER_POOL_ID=${UserPool}
            ANCHOR_BUCKET=${AnchorBucket}
            ANCHOR_KMS_KEY_ID=${AnchorKey}
            ANCHOR_LOCK_MODE=${AnchorLockMode}
            ANCHOR_RETENTION_DAYS=${AnchorRetentionDays}
            POLICYGUARD_HOME_ACCOUNT_ID=${AWS::AccountId}
            POLICYGUARD_SCANNER_ROLE_ARN=${ScannerRole.Arn}
            POLICYGUARD_INSTANCE_ROLE_ARN=${InstanceRole.Arn}
            POLICYGUARD_SCAN_INTERVAL_MINUTES=${ScanIntervalMinutes}
            ENV
            chmod 600 /etc/policyguard.env
            set -x
            cat > /etc/systemd/system/policyguard.service <<UNIT
            [Unit]
            Description=PolicyGuard dashboard
            After=network-online.target remote-fs.target
            [Service]
            WorkingDirectory=/opt/policyguard
            EnvironmentFile=/etc/policyguard.env
            ExecStart=/opt/policyguard/venv/bin/gunicorn --workers 2 --timeout 150 --bind 0.0.0.0:5000 --access-logfile - "dashboard.app:create_app()"
            Restart=always
            User=ec2-user
            [Install]
            WantedBy=multi-user.target
            UNIT
            chown -R ec2-user:ec2-user /opt/policyguard
            chown ec2-user:ec2-user /mnt/evidence
            systemctl daemon-reload
            systemctl enable --now policyguard

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: '120'}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true'}
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 5000
      TargetType: instance
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - {Key: deregistration_delay.timeout_seconds, Value: '30'}
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - {Type: forward, TargetGroupArn: !Ref TargetGroup}

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: !Sub '${AWS::StackName}-asg'
      MinSize: '2'
      MaxSize: '4'
      DesiredCapacity: !Ref DesiredCapacity
      VPCZoneIdentifier: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      TargetGroupARNs: [!Ref TargetGroup]
      HealthCheckType: ELB
      HealthCheckGracePeriod: 300
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - {Key: Name, Value: policyguard-dashboard, PropagateAtLaunch: true}
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT5M
        WaitOnResourceSignals: false
  ScaleOnCpu:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 50

  # ------------------------------------------------------------------ HTTPS front door (no domain needed)
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: PolicyGuard dashboard
        HttpVersion: http2
        Origins:
          - Id: alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          Compress: true
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0
          ForwardedValues:
            QueryString: true
            Headers: ['*']
            Cookies: {Forward: all}

Outputs:
  DashboardUrl:
    Description: Open this (HTTPS) and sign in with the Cognito invitation sent to the admin email
    Value: !Sub 'https://${Distribution.DomainName}'
  LoadBalancerUrl:
    Description: Direct ALB address, for the load balancer test (refresh and watch the instance ID change on the sign-in page)
    Value: !Sub 'http://${LoadBalancer.DNSName}'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ScannerFunctionName:
    Value: !Ref ScannerFunction
  AutoScalingGroupName:
    Value: !Ref AutoScalingGroup
  AnchorBucketName:
    Description: Object Lock bucket holding signed audit-chain receipts
    Value: !Ref AnchorBucket
  AnchorKeyId:
    Value: !Ref AnchorKey
  ScannerRoleArn:
    Description: Trusted by member-account roles (shown in the dashboard's account instructions)
    Value: !GetAtt ScannerRole.Arn
  EvidenceFileSystemId:
    Value: !Ref FileSystem
  DynamoDbTablePrefix:
    Value: !Ref AWS::StackName
